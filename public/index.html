<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; font-family: system-ui, sans-serif; background: #f4f1ea; color: #222; }
    #board { flex: 1; position: relative; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: #fffdf8; cursor: grab; touch-action: none; }
    aside { width: 340px; display: flex; flex-direction: column; border-left: 1px solid #ddd6c8; background: #faf7f0; }
    header { padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #ddd6c8; display: flex; justify-content: space-between; align-items: center; }
    #log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 10px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
    .user { background: #e3ecff; align-self: flex-end; }
    .bot { background: #fff; border: 1px solid #e5dfd2; }
    .error { background: #fde8e8; color: #8a1c1c; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #ddd6c8; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc4b4; border-radius: 8px; font-size: 14px; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #2d2d2d; color: #fff; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: 0.5; cursor: default; }
    #clear { background: transparent; color: #555; border: 1px solid #ccc4b4; padding: 4px 10px; }
  </style>
</head>
<body>
  <div id="board"><canvas id="canvas"></canvas></div>
  <aside>
    <header>Interactive Board <button id="clear" type="button">Clear</button></header>
    <div id="log"><div class="msg bot">Ask me to draw something, e.g. "draw a square", then "add a curved line coming out of the square and floating away".</div></div>
    <form id="form">
      <input id="prompt" placeholder="Describe a shape…" autocomplete="off" autofocus />
      <button id="send">Draw</button>
    </form>
  </aside>
  <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
  <script src="app.js"></script>
</body>
</html>
